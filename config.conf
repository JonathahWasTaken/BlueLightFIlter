# BlueLightFIlter configuration schema 2.
# Managed through bluefilter and the WebUI. Values are parsed as data and are
# never sourced as shell code.

[meta]
schema=2

[default]
profile=red-dim
brightness=0.55

# Column-major 4x4 matrix. The CLI validates coefficient, translation,
# homogeneous-row, output, and near-black safety bounds before applying it.
[custom]
matrix=1 0 0 0 0 0.50 0 0 0 0 0.20 0 0 0 0 1

[schedule]
enabled=0
sunset=21:00
sunrise=06:00

[notification]
enabled=0
